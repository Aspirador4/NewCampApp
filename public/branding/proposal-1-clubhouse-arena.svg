<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Turf Pitch Gradient -->
    <linearGradient id="pitchGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadowGlow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#059669" flood-opacity="0.35"/>
    </filter>

    <filter id="badgeShadow1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- PWA Squircle Background -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad1)"/>
  <rect x="12" y="12" width="488" height="488" rx="104" fill="none" stroke="#1e293b" stroke-width="3" stroke-opacity="0.8"/>

  <!-- Subtle Stadium Pitch Mesh Grid in Background -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1.5">
    <line x1="96" y1="64" x2="96" y2="448"/>
    <line x1="176" y1="64" x2="176" y2="448"/>
    <line x1="256" y1="64" x2="256" y2="448"/>
    <line x1="336" y1="64" x2="336" y2="448"/>
    <line x1="416" y1="64" x2="416" y2="448"/>
    <line x1="64" y1="128" x2="448" y2="128"/>
    <line x1="64" y1="208" x2="448" y2="208"/>
    <line x1="64" y1="288" x2="448" y2="288"/>
    <line x1="64" y1="368" x2="448" y2="368"/>
  </g>

  <!-- Main Emblem: The Clubhouse Arena Crest -->
  <!-- Combines a house gable roof with a stadium pitch curved bowl -->
  <g filter="url(#shadowGlow1)">
    <!-- Base Shield / House Pitch Shape -->
    <path d="M 256 82 
             L 396 178 
             L 396 330 
             C 396 395 333 434 256 434 
             C 179 434 116 395 116 330 
             L 116 178 Z"
          fill="url(#pitchGrad1)"
          filter="url(#badgeShadow1)"
          stroke="#34d399"
          stroke-width="5"
          stroke-linejoin="round"/>
  </g>

  <!-- Pitch Markings (White Athletic Lines) -->
  <!-- Outer pitch boundary margin -->
  <path d="M 256 114 
           L 370 192 
           L 370 326 
           C 370 376 319 408 256 408 
           C 193 408 142 376 142 326 
           L 142 192 Z"
        fill="none"
        stroke="#ffffff"
        stroke-width="4.5"
        stroke-opacity="0.9"
        stroke-linejoin="round"/>

  <!-- Midfield Line -->
  <line x1="142" y1="266" x2="370" y2="266" stroke="#ffffff" stroke-width="4.5" stroke-opacity="0.9"/>

  <!-- Center Circle -->
  <circle cx="256" cy="266" r="46" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-opacity="0.9"/>
  <circle cx="256" cy="266" r="7" fill="#ffffff"/>

  <!-- Upper Goal / Clubhouse Roof Truss Area -->
  <path d="M 220 180 L 220 148 L 256 124 L 292 148 L 292 180 Z" 
        fill="#047857" 
        fill-opacity="0.5" 
        stroke="#ffffff" 
        stroke-width="3.5" 
        stroke-linejoin="round"/>

  <!-- Bottom Penalty Box / Goal Area -->
  <path d="M 204 400 C 218 405 236 408 256 408 C 276 408 294 405 308 400 L 308 350 L 204 350 Z" 
        fill="#047857" 
        fill-opacity="0.5" 
        stroke="#ffffff" 
        stroke-width="3.5" 
        stroke-linejoin="round"/>
  <circle cx="256" cy="374" r="5" fill="#ffffff"/>

  <!-- Golden MVP Crown Star at the Roof Apex -->
  <g transform="translate(256, 56)">
    <!-- Glow -->
    <circle cx="0" cy="0" r="16" fill="#F59E0B" opacity="0.35"/>
    <!-- 4-point dynamic athletic star -->
    <path d="M 0 -18 L 4.5 -5 L 18 0 L 4.5 5 L 0 18 L -4.5 5 L -18 0 L -4.5 -5 Z" fill="#FBBF24"/>
    <circle cx="0" cy="0" r="3" fill="#ffffff"/>
  </g>
</svg>
