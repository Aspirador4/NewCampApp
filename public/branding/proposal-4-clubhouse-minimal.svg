<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Modern Gradient -->
    <linearGradient id="minBg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>

    <!-- Glassmorphic highlight -->
    <linearGradient id="glassLight4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="cleanShadow4" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#042f2e" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- PWA Squircle Background -->
  <rect width="512" height="512" rx="116" fill="url(#minBg4)"/>
  
  <!-- Subtle top ambient light gloss -->
  <rect width="512" height="256" rx="116" fill="url(#glassLight4)"/>

  <!-- Main Symbol: Iconic Clubhouse Gable intersecting Pitch Center Circle -->
  <g filter="url(#cleanShadow4)">
    <!-- Pitch Center Circle (Base) -->
    <circle cx="256" cy="270" r="120" fill="none" stroke="#ffffff" stroke-width="22" stroke-opacity="0.95"/>
    
    <!-- Midfield Horizontal Line -->
    <line x1="106" y1="270" x2="406" y2="270" stroke="#ffffff" stroke-width="22" stroke-linecap="round"/>

    <!-- Clubhouse Roof Peak (Bold Inverted V Gable) -->
    <path d="M 148 240 
             L 256 128 
             L 364 240" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Center Kickoff / MVP Golden Beacon Dot -->
    <circle cx="256" cy="270" r="26" fill="#FBBF24" stroke="#ffffff" stroke-width="6"/>

    <!-- Pennant / House Flag at Apex -->
    <path d="M 256 128 L 256 86 L 296 104 L 256 116" 
          fill="#FBBF24" 
          stroke="#FBBF24" 
          stroke-width="3" 
          stroke-linejoin="round"/>
  </g>

  <!-- Bottom Stadium Goal Line Arc -->
  <path d="M 206 390 C 222 400 238 406 256 406 C 274 406 290 400 306 390" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-opacity="0.6"/>
</svg>
